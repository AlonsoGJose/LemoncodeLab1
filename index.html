<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Ranking de tenis del club · Reserva, juega y consulta la clasificación
    </title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="font-sans leading-relaxed">
    <header
      class="sticky top-0 z-50 flex flex-wrap items-center justify-between gap-x-6 gap-y-2 border-b border-gray-200 bg-white px-4 py-3"
    >
      <!-- Logo: nombre de la app pendiente -->
      <a href="/" class="text-lg font-bold">Nombre de la app</a>

      <nav aria-label="Principal">
        <ul class="flex flex-wrap gap-x-4 gap-y-1">
          <li><a href="#funcionalidades">Funcionalidades</a></li>
          <li><a href="#como-funciona">Cómo funciona</a></li>
          <li><a href="#faq">Preguntas</a></li>
          <li><a href="#">Entrar</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Hero -->
      <section
        aria-labelledby="hero-titulo"
        class="flex min-h-[33dvh] flex-col justify-center px-4 py-12"
      >
        <h1 id="hero-titulo" class="text-3xl font-bold">
          El ranking de tu club, sin Excel
        </h1>
      </section>

      <!-- Tarjetas (O5) -->
      <section
        id="funcionalidades"
        aria-labelledby="funcionalidades-titulo"
        class="px-4 py-12"
      >
        <h2 id="funcionalidades-titulo" class="mb-6 text-2xl font-bold">
          Todo lo que puedes hacer
        </h2>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
          <article class="rounded-lg border border-gray-200 p-4">
            <h3 class="font-semibold">Reservar pista</h3>
          </article>

          <article class="rounded-lg border border-gray-200 p-4">
            <h3 class="font-semibold">Clasificación</h3>
          </article>

          <article class="rounded-lg border border-gray-200 p-4">
            <h3 class="font-semibold">Mis partidos</h3>
          </article>

          <article class="rounded-lg border border-gray-200 p-4">
            <h3 class="font-semibold">Subir resultado</h3>
          </article>

          <article class="rounded-lg border border-gray-200 p-4">
            <h3 class="font-semibold">Normas</h3>
          </article>

          <article class="rounded-lg border border-gray-200 p-4">
            <h3 class="font-semibold">Mi perfil</h3>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
